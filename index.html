<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index con 5 secciones - Bootstrap 5</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .seccion {
        padding: 30px 15px;
        border-radius: 12px;
        margin-bottom: 25px;
        background-color: #f8f9fa;
        border-left: 6px solid #a70c40;
        box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .seccion h1 {
        color: #450404;
        font-size: 1.6rem;
    }
  </style>
</head>
<body class="bg-light">

  <div class="container my-5">
    <div class="seccion text-center">
      <h1 class="display-5 fw-bold">Sitio Colaborativo - Grupo 1</h1>
      <p class="lead">Bienvenido, esta página está hecha por distintas personas</p>
      <a href="#" class="btn btn-primary btn-lg mt-2" onclick="alert('Hola');">Saludo</a>
    </div>

    <div class="seccion">
        <!-- Oscar -->
    </div>

  <div class="seccion">
    <!-- Marvin -->
    <h1 class="fw-bold">Sección de Marvin</h1>

    <p class="lead">
        Hola, soy Marvin. Esta es mi sección dentro del sitio colaborativo del Grupo 1.
    </p>

    <div class="card mt-3">
        <div class="card-body">
            <h5 class="card-title">Mi aporte al proyecto</h5>
            <p class="card-text">
                Esta sección fue desarrollada utilizando HTML, CSS y Bootstrap 5.
            </p>

            <button class="btn btn-success"
                    onclick="alert('¡Hola! Esta es la sección de Marvin')">
                Presióname
            </button>
        </div>
    </div>
</div>

    <div class="seccion">
        <!-- Pamela -->
    </div>

    <div class="seccion">
        <!-- Gustavo -->
    </div>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
